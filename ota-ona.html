<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ota-ona Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Panelni silliq ochilishi uchun animatsiya */
        .panel-transition { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen overflow-hidden flex justify-center">

    <!-- MOBIL KORINISH UCHUN ASOSIY QISM -->
    <div class="w-full max-w-md h-full bg-white relative shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Tepasi (Profil) -->
        <div class="flex-1 p-6 flex flex-col items-center justify-center bg-gradient-to-b from-blue-50 to-white">
            <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mb-4 shadow-inner">
                <span class="text-4xl">👨‍👩‍👦</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Alisher Tohirov</h1>
            <p class="text-slate-500 mt-1">Ota-onalar profili</p>
            
            <div class="mt-8 bg-white p-4 rounded-xl shadow-sm border border-slate-100 w-full text-center">
                <p class="text-sm text-slate-500">Joriy balans</p>
                <p class="text-3xl font-bold text-green-600 mt-1">245,000 so'm</p>
            </div>
        </div>

        <!-- PASTDAGI "OCHISH" TUGMASI -->
        <div class="p-4 bg-white border-t border-slate-100 z-10">
            <button onclick="panelniOchish()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all flex justify-center items-center gap-2 text-lg">
                <span class="text-2xl">⬆️</span> Panelni Ochish
            </button>
        </div>

        <!-- TEPAGA QARAB OCHILADIGAN KATTA PANEL (Boshida yashiringan) -->
        <div id="kattaPanel" class="absolute inset-0 bg-white z-20 transform translate-y-full panel-transition flex flex-col">
            <!-- Panel tepasi (yopish tugmasi) -->
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white shadow-sm">
                <h2 class="text-xl font-bold text-slate-800">Boshqaruv Paneli</h2>
                <button onclick="panelniYopish()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200">
                    ✕
                </button>
            </div>

            <!-- Panel ichidagi bo'limlar -->
            <div class="flex-1 p-4 overflow-y-auto bg-slate-50">
                <div class="grid grid-cols-2 gap-4">
                    
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center active:scale-95 transition-transform">
                        <span class="text-4xl mb-3">📅</span>
                        <h3 class="font-bold text-slate-700">Davomat</h3>
                        <p class="text-xs text-slate-500 mt-1">Kelgan va qoldirilgan darslar</p>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center active:scale-95 transition-transform">
                        <span class="text-4xl mb-3">💳</span>
                        <h3 class="font-bold text-slate-700">To'lovlar</h3>
                        <p class="text-xs text-slate-500 mt-1">To'lov qilish va cheklar</p>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center active:scale-95 transition-transform">
                        <span class="text-4xl mb-3">⏰</span>
                        <h3 class="font-bold text-slate-700">Dars jadvali</h3>
                        <p class="text-xs text-slate-500 mt-1">Dars kunlari va vaqti</p>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center active:scale-95 transition-transform">
                        <span class="text-4xl mb-3">📈</span>
                        <h3 class="font-bold text-slate-700">O'zlashtirish</h3>
                        <p class="text-xs text-slate-500 mt-1">Baholar va natijalar</p>
                    </div>

                </div>
            </div>
        </div>
        
    </div>

    <script>
        // JS mantiqi: Panelni ochish va yopish
        function panelniOchish() {
            document.getElementById('kattaPanel').classList.remove('translate-y-full');
            document.getElementById('kattaPanel').classList.add('translate-y-0');
        }

        function panelniYopish() {
            document.getElementById('kattaPanel').classList.remove('translate-y-0');
            document.getElementById('kattaPanel').classList.add('translate-y-full');
        }
    </script>
</body>
</html>
